# Tiny Tapeout project information
project:
  title:        "Compute Tile Smoke Island"      # Project title
  author:       "Mason Brothers / AI ASIC Compute Tile"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Tiny Tapeout bring-up island for a locked Compute Tile byte-compute primitive"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     1000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_masonbrothers_compute_tile_top"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "compute_tile_tiny_tapeout_core.v"
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "cmd_imm[0]"
  ui[1]: "cmd_imm[1]"
  ui[2]: "cmd_imm[2]"
  ui[3]: "cmd_imm[3]"
  ui[4]: "cmd_imm[4]"
  ui[5]: "cmd_opcode[0]"
  ui[6]: "cmd_opcode[1]"
  ui[7]: "cmd_opcode[2]"

  # Outputs
  uo[0]: "status_or_result[0] / led_alive / uart_tx_alt"
  uo[1]: "status_or_result[1] / led_unlocked"
  uo[2]: "status_or_result[2] / led_result_valid"
  uo[3]: "status_or_result[3] / led_error"
  uo[4]: "status_or_result[4] / led_selftest / uart_tx"
  uo[5]: "status_or_result[5] / led_fault_mode"
  uo[6]: "status_or_result[6] / led_activity"
  uo[7]: "status_or_result[7] / led_trace_parity"

  # Bidirectional pins
  uio[0]: "data_lane[0] / spi_ram_cs"
  uio[1]: "data_lane[1] / spi_ram_mosi"
  uio[2]: "data_lane[2] / spi_ram_miso"
  uio[3]: "data_lane[3] / spi_ram_sck"
  uio[4]: "data_lane[4] / qspi_sd2"
  uio[5]: "data_lane[5] / qspi_sd3"
  uio[6]: "data_lane[6] / qspi_ram_a_cs"
  uio[7]: "data_lane[7] / qspi_ram_b_cs"

# Do not change!
yaml_version: 6
